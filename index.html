```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pet Shop</title>

    <!-- Fonte -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">


</head>


<body>


    <!-- =========================
         HEADER
    ========================== -->

    <header>

        <div class="logo">
            LOGO
        </div>

    </header>



    <!-- =========================
         TELA INICIAL
    ========================== -->

    <section class="hero">


        <div class="hero-content">

            <h1>
                Tudo para o seu pet
            </h1>

            <p>
                Cuide, proteja e dê carinho para quem faz parte da família.
            </p>

        </div>


        <!-- BOTÃO DE ROLAGEM -->

        <button
            class="scroll-button"
            onclick="document.getElementById('busca').scrollIntoView();"
            aria-label="Ir para busca">

            ↓

        </button>


    </section>



    <!-- =========================
         BUSCA
    ========================== -->

    <section
        class="search-section"
        id="busca">

        <div class="search-box">

            <span class="search-icon">
                🔍
            </span>

            <input
                type="text"
                placeholder="o que seu pet precisa?"
                id="searchInput">

        </div>

    </section>



    <!-- =========================
         CATEGORIAS
    ========================== -->

    <section class="categories">

        <h2>
            Encontre o que seu pet precisa
        </h2>


        <!-- PRIMEIRA LINHA -->

        <div class="category-row">

            <button class="category-button">
                Cachorro
            </button>

            <button class="category-button">
                Gato
            </button>

            <button class="category-button">
                Peixe
            </button>

            <button class="category-button">
                Outros pets
            </button>

        </div>


        <!-- SEGUNDA LINHA -->

        <div class="category-row">

            <button class="category-button">
                Promoções
            </button>

            <button class="category-button">
                Serviços
            </button>

            <button class="category-button">
                Casa e fora
            </button>

        </div>

    </section>



    <!-- =========================
         CONTEÚDO FINAL
    ========================== -->

    <section class="content">

        <h2>
            Cuide de quem faz parte da sua família
        </h2>

        <p>
            Encontre produtos, serviços e soluções para deixar
            seu pet saudável, feliz e bem cuidado.
        </p>

    </section>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        const searchInput =
            document.getElementById("searchInput");


        searchInput.addEventListener(
            "keypress",
            function(event) {

                if (event.key === "Enter") {

                    const pesquisa =
                        searchInput.value.trim();

                    if (pesquisa !== "") {

                        alert(
                            "Você pesquisou por: " +
                            pesquisa
                        );

                    } else {

                        alert(
                            "Digite o que seu pet precisa."
                        );

                    }

                }

            }
        );


        const buttons =
            document.querySelectorAll(
                ".category-button"
            );


        buttons.forEach(
            function(button) {

                button.addEventListener(
                    "click",
                    function() {

                        alert(
                            "Você selecionou: " +
                            button.textContent.trim()
                        );

                    }
                );

            }
        );

    </script>


</body>

</html>
```
