```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pet Shop</title>

    <!-- Fonte -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>

        /* =========================
           CONFIGURAÇÕES GERAIS
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Poppins", sans-serif;
            background: #f4f5f7;
            color: #14243d;
        }


        /* =========================
           HEADER
        ========================= */

        header {
            position: absolute;
            top: 0;
            left: 0;

            width: 100%;
            height: 75px;

            display: flex;
            justify-content: center;
            align-items: center;

            background: rgba(225, 227, 230, 0.90);

            z-index: 10;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #14243d;
        }


        /* =========================
           TELA INICIAL
        ========================= */

        .hero {
            width: 100%;
            height: 100vh;
            min-height: 600px;

            position: relative;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }


        /* =========================
           IMAGEM OCUPANDO A TELA
        ========================= */

        .hero::before {

            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.25),
                    rgba(0, 0, 0, 0.25)
                ),
                url("pet.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            z-index: 0;
        }


        /* =========================
           TEXTO SOBRE A IMAGEM
        ========================= */

        .hero-content {

            position: relative;

            z-index: 2;

            text-align: center;

            color: white;

            padding: 20px;

        }

        .hero-content h1 {

            font-size: clamp(35px, 6vw, 70px);

            font-weight: 700;

            margin-bottom: 15px;

            text-shadow:
                0 3px 15px rgba(0, 0, 0, 0.5);

        }

        .hero-content p {

            font-size: clamp(16px, 2vw, 24px);

            text-shadow:
                0 2px 10px rgba(0, 0, 0, 0.5);

        }


        /* =========================
           BOTÃO ↓
        ========================= */

        .scroll-button {

            position: absolute;

            bottom: 35px;

            left: 50%;

            transform: translateX(-50%);

            width: 60px;
            height: 60px;

            border: none;

            border-radius: 50%;

            background: #14243d;

            color: white;

            font-size: 30px;

            cursor: pointer;

            z-index: 5;

            transition: 0.3s;

        }

        .scroll-button:hover {

            background: #f5c400;

            color: #14243d;

            transform:
                translateX(-50%)
                translateY(-5px);

        }


        /* =========================
           BUSCA
        ========================= */

        .search-section {

            width: 100%;

            padding: 40px 20px;

            background: white;

        }

        .search-box {

            max-width: 750px;

            height: 60px;

            margin: auto;

            display: flex;

            align-items: center;

            padding: 0 22px;

            background: #f1f3f5;

            border: 2px solid #e1e3e6;

            border-radius: 35px;

            transition: 0.3s;

        }

        .search-box:focus-within {

            border-color: #14243d;

            box-shadow:
                0 5px 20px rgba(20, 36, 61, 0.12);

        }

        .search-icon {

            font-size: 22px;

            margin-right: 12px;

        }

        .search-box input {

            width: 100%;

            height: 100%;

            border: none;

            outline: none;

            background: transparent;

            font-family: "Poppins", sans-serif;

            font-size: 16px;

            color: #14243d;

        }

        .search-box input::placeholder {

            color: #777;

        }


        /* =========================
           CATEGORIAS
        ========================= */

        .categories {

            padding: 55px 20px;

            text-align: center;

            background: #f4f5f7;

        }

        .categories h2 {

            font-size: 30px;

            margin-bottom: 30px;

        }

        .category-row {

            display: flex;

            justify-content: center;

            align-items: center;

            flex-wrap: wrap;

            gap: 15px;

            margin-bottom: 18px;

        }


        /* =========================
           BOTÕES
        ========================= */

        .category-button {

            border: none;

            padding: 13px 28px;

            border-radius: 30px;

            background: #14243d;

            color: white;

            font-family: "Poppins", sans-serif;

            font-size: 15px;

            font-weight: 500;

            cursor: pointer;

            transition: 0.3s;

        }

        .category-button:hover {

            background: #f5c400;

            color: #14243d;

            transform: translateY(-4px);

            box-shadow:
                0 8px 18px rgba(0, 0, 0, 0.15);

        }


        /* =========================
           CONTEÚDO
        ========================= */

        .content {

            min-height: 300px;

            padding: 70px 20px;

            background: white;

            text-align: center;

        }

        .content h2 {

            font-size: 28px;

            margin-bottom: 15px;

        }

        .content p {

            max-width: 650px;

            margin: auto;

            color: #68717c;

            line-height: 1.8;

        }


        /* =========================
           CELULAR
        ========================= */

        @media (max-width: 600px) {

            header {

                height: 65px;

            }

            .logo {

                font-size: 23px;

            }

            .hero {

                min-height: 600px;

            }

            .hero-content h1 {

                font-size: 38px;

            }

            .hero-content p {

                font-size: 16px;

            }

            .category-row {

                flex-direction: column;

            }

            .category-button {

                width: 100%;

                max-width: 320px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================== -->

    <header>

        <div class="logo">
            LOGO
        </div>

    </header>



    <!-- =========================
         TELA INICIAL
    ========================== -->

    <section class="hero">


        <div class="hero-content">

            <h1>
                Tudo para o seu pet
            </h1>

            <p>
                Cuide, proteja e dê carinho para quem faz parte da família.
            </p>

        </div>


        <!-- BOTÃO DE ROLAGEM -->

        <button
            class="scroll-button"
            onclick="document.getElementById('busca').scrollIntoView();"
            aria-label="Ir para busca">

            ↓

        </button>


    </section>



    <!-- =========================
         BUSCA
    ========================== -->

    <section
        class="search-section"
        id="busca">

        <div class="search-box">

            <span class="search-icon">
                🔍
            </span>

            <input
                type="text"
                placeholder="o que seu pet precisa?"
                id="searchInput">

        </div>

    </section>



    <!-- =========================
         CATEGORIAS
    ========================== -->

    <section class="categories">

        <h2>
            Encontre o que seu pet precisa
        </h2>


        <!-- PRIMEIRA LINHA -->

        <div class="category-row">

            <button class="category-button">
                Cachorro
            </button>

            <button class="category-button">
                Gato
            </button>

            <button class="category-button">
                Peixe
            </button>

            <button class="category-button">
                Outros pets
            </button>

        </div>


        <!-- SEGUNDA LINHA -->

        <div class="category-row">

            <button class="category-button">
                Promoções
            </button>

            <button class="category-button">
                Serviços
            </button>

            <button class="category-button">
                Casa e fora
            </button>

        </div>

    </section>



    <!-- =========================
         CONTEÚDO FINAL
    ========================== -->

    <section class="content">

        <h2>
            Cuide de quem faz parte da sua família
        </h2>

        <p>
            Encontre produtos, serviços e soluções para deixar
            seu pet saudável, feliz e bem cuidado.
        </p>

    </section>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        const searchInput =
            document.getElementById("searchInput");


        searchInput.addEventListener(
            "keypress",
            function(event) {

                if (event.key === "Enter") {

                    const pesquisa =
                        searchInput.value.trim();

                    if (pesquisa !== "") {

                        alert(
                            "Você pesquisou por: " +
                            pesquisa
                        );

                    } else {

                        alert(
                            "Digite o que seu pet precisa."
                        );

                    }

                }

            }
        );


        const buttons =
            document.querySelectorAll(
                ".category-button"
            );


        buttons.forEach(
            function(button) {

                button.addEventListener(
                    "click",
                    function() {

                        alert(
                            "Você selecionou: " +
                            button.textContent.trim()
                        );

                    }
                );

            }
        );

    </script>


</body>

</html>
```
